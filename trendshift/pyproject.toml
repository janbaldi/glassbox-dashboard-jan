[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trendshift"
version = "0.1.0"
description = "Find trend shifts with exact segmented regression and BIC model selection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
